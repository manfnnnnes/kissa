name: Проверка

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Синхронизировать package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Сохранить исправленный package-lock.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json уже синхронизирован.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: синхронизировать package-lock.json'
          git push

      - name: Установить зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Проверить TypeScript
        run: npm run typecheck

      - name: Проверить ESLint
        run: npm run lint

      - name: Запустить тесты
        run: npm test

      - name: Проверить production-сборку
        run: npm run build
