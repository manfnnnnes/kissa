<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./og-fonts/fonts.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #2A1A16;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 1200px;
      height: 630px;
      object-fit: cover;
      display: block;
    }
    .wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 58% at 50% 48%, rgba(246, 239, 230, 0.55) 0%, rgba(246, 239, 230, 0.18) 46%, rgba(42, 26, 22, 0.22) 100%),
        linear-gradient(180deg, rgba(42, 26, 22, 0.18) 0%, rgba(42, 26, 22, 0.08) 40%, rgba(42, 26, 22, 0.28) 100%);
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 780px;
      text-align: center;
      color: #7A2E3A;
    }
    .heart {
      width: 34px;
      height: 34px;
      fill: #7A2E3A;
      display: block;
      margin: 0 auto 18px;
      filter: drop-shadow(0 1px 0 rgba(246, 239, 230, 0.7));
    }
    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: 92px;
      line-height: 0.95;
      letter-spacing: 0.03em;
      color: #7A2E3A;
      text-shadow:
        0 1px 0 rgba(246, 239, 230, 0.85),
        0 8px 28px rgba(246, 239, 230, 0.35);
    }
    .rule {
      width: 88px;
      height: 1px;
      margin: 22px auto 16px;
      background: #C9898C;
      opacity: 0.95;
    }
    p {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.12em;
      color: #2A1A16;
      opacity: 0.82;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="bg" src="./og-bg.jpg" alt="" />
    <div class="wash"></div>
    <div class="lockup">
      <svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s-6.2-4.35-9.14-8.22C.7 10.1.9 6.7 3.4 4.9c2.1-1.52 4.7-.86 6.1 1.12C10.9 4.04 13.5 3.38 15.6 4.9c2.5 1.8 2.7 5.2.54 7.88C18.2 16.65 12 21 12 21z" />
      </svg>
      <h1>Для коханої</h1>
      <div class="rule"></div>
      <p>Історія нашого кохання</p>
    </div>
  </div>
</body>
</html>
